  <circle cx="17" cy="17" r="4.5" fill="url(#g)"/>
  <text x="40" y="24" font-family="'Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="url(#g)">OIOS</text>
