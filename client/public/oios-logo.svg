<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34" role="img" aria-label="OIOS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D62598"/>
      <stop offset="1" stop-color="#a81b77"/>
    </linearGradient>
  </defs>
  <!-- 仮ロゴ(OIOS = Ordermade Insole Order System)。正式な OIOS 画像を client/public/oios-logo.svg または .png に差し替え可 -->
